name: B-Chess Android release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a compilar (ej. 1.0.4)'
        required: true

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Las licencias del SDK de Android deben aceptarse de forma NO interactiva.
      # Si no, "sdkmanager --licenses" se queda esperando el prompt "Accept? (y/N)"
      # y el job termina fallando por timeout.
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            for i in 1 2 3; do
              yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            done
          fi
          # Respaldo: hashes de las licencias habituales, escritos a mano para
          # garantizar que nada tenga que preguntar nada.
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          echo "859f317696f67ef3d7f30a50a5560e7834b43903" > "$ANDROID_SDK_ROOT/licenses/android-sdk-arm-dbt-license"
          echo "601085b94cd77f0b54ff86406957099ebe79c4d6" > "$ANDROID_SDK_ROOT/licenses/android-googletv-license"
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" > "$ANDROID_SDK_ROOT/licenses/intel-android-extra-license"

      # No se usa android-actions/setup-android: intenta instalar el paquete
      # "tools", que ya no existe en los repositorios de Google, y el job falla.
      # El SDK se instala a mano con el sdkmanager del runner.
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found in $ANDROID_SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          # Las licencias ya estan aceptadas en el paso anterior, asi que
          # sdkmanager no debe preguntar nada. No se usa "yes |" porque al
          # cerrar la entrada sdkmanager, yes muere con SIGPIPE y el step
          # falla con "Broken pipe" bajo pipefail.
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Configure B-Chess release signing
        env:
          BCHESS_ANDROID_KEYSTORE_BASE64: ${{ secrets.BCHESS_ANDROID_KEYSTORE_BASE64 }}
          BCHESS_ANDROID_KEYSTORE_PROPERTIES_BASE64: ${{ secrets.BCHESS_ANDROID_KEYSTORE_PROPERTIES_BASE64 }}
        run: |
          if [[ -z "$BCHESS_ANDROID_KEYSTORE_BASE64" || -z "$BCHESS_ANDROID_KEYSTORE_PROPERTIES_BASE64" ]]; then
            echo "Configure the B-Chess signing secrets before publishing a release." >&2
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$BCHESS_ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore/bchess-release.jks
          printf '%s' "$BCHESS_ANDROID_KEYSTORE_PROPERTIES_BASE64" | base64 --decode > keystore.properties

      - name: Build signed B-Chess APK
        run: |
          chmod +x gradlew
          version="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use semantic versioning, for example v1.0.1." >&2
            exit 1
          fi
          ./gradlew :app:assembleRelease -PbchessVersion="$version"
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/B-Chess-${version}.apk"

      - name: Include Stockfish corresponding source
        run: |
          curl --fail --location \
            https://github.com/official-stockfish/Stockfish/archive/refs/tags/sf_19.tar.gz \
            --output app/build/outputs/apk/release/Stockfish-sf_19-source.tar.gz

      - name: Attach assets to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          files: |
            app/build/outputs/apk/release/B-Chess-*.apk
            app/build/outputs/apk/release/Stockfish-sf_19-source.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets (manual run)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -e
          version="${{ inputs.version }}"
          gh release upload "v${version}" \
            app/build/outputs/apk/release/B-Chess-${version}.apk \
            app/build/outputs/apk/release/Stockfish-sf_19-source.tar.gz \
            --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
